[project]
name = "langchain-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harpreet Singh", email = "hsit18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-generativeai>=0.8.6",
    "grandalf>=0.8",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.8",
    "langchain-anthropic>=1.7.9",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "openai>=3.42.1",
    "pydantic[email]>=2.12.5",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.6",
    "transformers>=5.22.1",
]

[project.scripts]
langchain-app = "langchain_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
